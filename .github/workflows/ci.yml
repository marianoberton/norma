name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  servicio:
    name: Servicio (TypeScript)
    runs-on: ubuntu-latest
    env:
      # Los tests no llaman a ninguna API: las claves solo tienen que existir.
      OPENAI_API_KEY: ci
      OPENROUTER_API_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ts

  ingesta:
    name: Ingesta (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pymupdf
      - run: python -m unittest discover -s tests -v
